# Kitty reads the adjacent *-theme.auto.conf files and follows macOS appearance.

# Use exact faces so TX-02's condensed variants are not selected accidentally.
font_family      postscript_name=TX-02-Retina features="+ss01 -calt"
bold_font        postscript_name=TX-02-Bold features="+ss01 -calt"
italic_font      postscript_name=TX-02-RetinaOblique features="+ss01 -calt"
bold_italic_font postscript_name=TX-02-BoldOblique features="+ss01 -calt"
font_size 14
# Approximate Ghostty's native blending instead of Kitty's macOS contrast boost.
text_composition_strategy legacy
# Kitty supplies a built-in Nerd Font fallback;
modify_font cell_height 130%
modify_font underline_position -2px
modify_font underline_thickness -1px

cursor_shape beam
cursor_beam_thickness 2

window_padding_width 2 6
placement_strategy center
background_opacity 1.0
mouse_hide_wait -1

# Kitty cannot embed native tabs in the macOS titlebar
tab_bar_edge top
tab_bar_style separator
tab_bar_min_tabs 2
macos_option_as_alt left
macos_thicken_font 0

# Keep shell-managed titles and cursor integration, without sudo wrapping.
shell_integration no-title no-sudo
enable_audio_bell no
window_alert_on_bell yes
bell_on_tab yes

